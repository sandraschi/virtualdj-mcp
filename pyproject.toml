[build-system]
requires = ["setuptools>=42.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virtualdj-mcp"
version = "2.0.0b2"
description = "FastMCP server for VirtualDJ automation - Professional DJ control with Austrian efficiency"
readme = "README.md"
authors = [
    {name = "Sandra Schilling (sandraschi)", email = "sandraschipal@gmail.com"},
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Mixers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Core dependencies
    "fastmcp>=3.4.4,<4",
    "fastapi>=0.95.0",
    "uvicorn[standard]>=0.22.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    # HTTP client for VirtualDJ REST API
    "aiohttp>=3.8.0",
    "httpx>=0.24.0",
    # Audio processing and analysis
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
    "mutagen>=1.47.0",
    "aubio>=0.4.9",
    # Utilities
    "typing-extensions>=4.5.0",
    "python-dateutil>=2.8.2",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "prefab-ui>=0.14.0",
    "python-osc>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/sandraschi/virtualdj-mcp"
Documentation = "https://github.com/sandraschi/virtualdj-mcp#readme"
Issues = "https://github.com/sandraschi/virtualdj-mcp/issues"
Source = "https://github.com/sandraschi/virtualdj-mcp"

[project.scripts]
virtualdj-mcp = "virtualdj_mcp.__main__:main"

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",

    # Code quality
    "black>=23.7.0",
    "isort>=5.12.0",
    "mypy>=1.4.0",
    "ruff>=0.16.0,<0.17",

    # Audio analysis (optional, for advanced features)
    "pyaudio>=0.2.11; platform_system=='Windows'",
    "scipy>=1.10.0",
]

docs = [
    "mkdocs>=1.4.3",
    "mkdocs-material>=9.1.15",
]

[project.entry-points]
"fastmcp.plugins" = { virtualdj = "virtualdj_mcp.server:main" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S101", "B008", "S101", "B008", "E402", "RUF001", "S101", "B008", "E402", "RUF001", "RUF012", "B904", "E501", "S106", "S110", "S112", "B904", "E501", "S603", "S607", "S324", "RUF001", "S101", "B008", "S101", "B008", "E402", "RUF001", "S101", "B008", "E402", "RUF001", "RUF012", "B904", "E501", "S106", "S110", "S112", "B904", "E501", "S603", "S607", "S324", "RUF001", "RUF012", "B904", "E501", "S106", "S110", "S112", "B904", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/local/**" = ["E501"]
  "tests/test_mixer_controller.py" = ["S101", "B008", "E402", "RUF001", "S101", "B008", "E402", "RUF001", "RUF012", "B904", "E501", "S106", "S110", "S112", "B904", "E501", "S603", "S607", "S324", "E501"]
  "scripts/cua-webapp-test.py" = ["B007", "S310", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--ignore=tests/local/test_http_api.py --ignore=tests/test_mixer_controller.py"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pyinstaller>=6.21.0",
    "ruff>=0.16.0,<0.17",
]
